[project]
name = "starrail-warp-monte-carlo-simulation"
version = "0.1.0"
description = ""
authors = [
    {name = "Peter-Ho-Netflix",email = "diannaobingdukb@aliyun.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "tqdm (>=4.70.1,<5.0.0)"
]

[tool.poetry]
